name: Build timelm GENI I2C prototype
on:
  workflow_dispatch:
  push:
    paths:
      - 'GPLDrivers/Windows/KonaGeniI2c/**'
      - 'Resources/Scripts/build_geni_i2c.ps1'
      - 'Platforms/LG/timelmPkg/Experimental/TouchI2c.asl'
      - 'Platforms/LG/timelmPkg/Applications/I2cClockDiag/**'
      - 'Resources/Scripts/build_i2c_clockdiag.sh'
      - '.github/workflows/test-geni-i2c.yml'
  pull_request:
    paths:
      - 'GPLDrivers/Windows/KonaGeniI2c/**'
      - 'Resources/Scripts/build_geni_i2c.ps1'
      - 'Platforms/LG/timelmPkg/Experimental/TouchI2c.asl'
      - 'Platforms/LG/timelmPkg/Applications/I2cClockDiag/**'
      - 'Resources/Scripts/build_i2c_clockdiag.sh'
      - '.github/workflows/test-geni-i2c.yml'
permissions:
  contents: read
jobs:
  arm64-host:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./Resources/Scripts/build_geni_i2c.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timelm-GENI-I2C-ARM64-prototype
          path: GPLDrivers/Windows/KonaGeniI2c/out/
          if-no-files-found: warn
          retention-days: 14
  fifo-and-acpi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise FIFO transfers and failure paths
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            GPLDrivers/Windows/KonaGeniI2c/tests/fifo_test.c \
            GPLDrivers/Windows/KonaGeniI2c/geni_fifo.c -o /tmp/geni-fifo-test
          /tmp/geni-fifo-test
      - name: Compile disabled ACPI candidate
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y acpica-tools clang lld
          iasl -ve -p /tmp/TouchI2c Platforms/LG/timelmPkg/Experimental/TouchI2c.asl
      - uses: actions/upload-artifact@v4
        with:
          name: timelm-touch-SSDT-disabled
          path: /tmp/TouchI2c.aml
          if-no-files-found: error
          retention-days: 14
      - name: Build standalone ARM64 UEFI clock query app
        run: |
          git submodule update --init --depth 1 Mu_Basecore
          bash Resources/Scripts/build_i2c_clockdiag.sh
      - name: Test restore-before-query and Windows chainload behavior
        run: |
          gcc -std=c11 -fshort-wchar -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            -I Mu_Basecore/MdePkg/Include -I Mu_Basecore/MdePkg/Include/X64 \
            -I Silicon/Qualcomm/QcomPkg/Include \
            Platforms/LG/timelmPkg/Applications/I2cClockDiag/tests/oneshot_test.c \
            -o /tmp/oneshot-test
          /tmp/oneshot-test
      - uses: actions/upload-artifact@v4
        with:
          name: timelm-I2cClockDiag-ARM64-UEFI
          path: |
            Build/I2cClockDiag/I2cClockDiag.efi
            Build/I2cClockDiag/source.json
            Build/I2cClockDiag/I2cClockOnce.efi
            Build/I2cClockDiag/oneshot.json
          if-no-files-found: error
          retention-days: 14
