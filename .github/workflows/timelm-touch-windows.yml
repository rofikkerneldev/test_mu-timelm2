name: Build native Windows timelm touch bring-up
on:
  workflow_dispatch:
  push:
    branches-ignore: [codex/astra-touch-gpio-r13]
    paths:
      - 'GPLDrivers/Windows/**'
      - 'Resources/DeviceOverlays/timelm/Drivers/KonaGPIO/**'
      - 'Resources/DeviceOverlays/timelm/Drivers/KonaSPMI/**'
      - 'Resources/Scripts/build_kona_drivers.ps1'
      - 'Resources/Scripts/build_geni_i2c.ps1'
      - 'Resources/Scripts/build_sw42902_touch.ps1'
      - 'Resources/Scripts/Collect-TimelmDiagnostics.ps1'
      - 'Resources/Scripts/Collect-TimelmRecoveryTouch.sh'
      - 'Resources/Scripts/build_touch_dma_check.sh'
      - 'Platforms/LG/timelmPkg/Applications/TouchDmaCheck/**'
      - 'Platforms/LG/timelmPkg/Applications/TouchEnumeration/**'
      - 'Platforms/LG/timelmPkg/Applications/I2cClockDiag/OneShot.h'
      - 'Resources/Scripts/build_touch_enumeration.sh'
      - 'Resources/Scripts/build_touch_gpio_trial.sh'
      - 'Resources/Scripts/TouchGpio/**'
      - 'Resources/Scripts/Buttons/**'
      - 'Resources/Scripts/generate_touch_enumeration.py'
      - 'Resources/Scripts/TouchEnumeration/**'
      - 'Platforms/LG/timelmPkg/Experimental/TouchWindows.asl'
      - 'Platforms/LG/timelmPkg/Experimental/**'
      - 'Resources/Scripts/build_timelm_touch_iort.py'
      - 'Resources/Scripts/tests/test_timelm_touch_iort.py'
      - '.github/workflows/timelm-touch-windows.yml'
  pull_request:
    paths:
      - 'GPLDrivers/Windows/**'
      - 'Resources/DeviceOverlays/timelm/Drivers/KonaGPIO/**'
      - 'Resources/DeviceOverlays/timelm/Drivers/KonaSPMI/**'
      - 'Resources/Scripts/build_kona_drivers.ps1'
      - 'Resources/Scripts/build_geni_i2c.ps1'
      - 'Resources/Scripts/build_sw42902_touch.ps1'
      - 'Resources/Scripts/Collect-TimelmDiagnostics.ps1'
      - 'Resources/Scripts/Collect-TimelmRecoveryTouch.sh'
      - 'Resources/Scripts/build_touch_dma_check.sh'
      - 'Platforms/LG/timelmPkg/Applications/TouchDmaCheck/**'
      - 'Platforms/LG/timelmPkg/Applications/TouchEnumeration/**'
      - 'Platforms/LG/timelmPkg/Applications/I2cClockDiag/OneShot.h'
      - 'Resources/Scripts/build_touch_enumeration.sh'
      - 'Resources/Scripts/build_touch_gpio_trial.sh'
      - 'Resources/Scripts/TouchGpio/**'
      - 'Resources/Scripts/Buttons/**'
      - 'Resources/Scripts/generate_touch_enumeration.py'
      - 'Resources/Scripts/TouchEnumeration/**'
      - 'Platforms/LG/timelmPkg/Experimental/TouchWindows.asl'
      - 'Platforms/LG/timelmPkg/Experimental/**'
      - 'Resources/Scripts/build_timelm_touch_iort.py'
      - 'Resources/Scripts/tests/test_timelm_touch_iort.py'
      - '.github/workflows/timelm-touch-windows.yml'
permissions:
  contents: read
jobs:
  windows-host-and-client:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          ./Resources/Scripts/build_geni_i2c.ps1
          ./Resources/Scripts/build_sw42902_touch.ps1
      - shell: powershell
        run: ./Resources/Scripts/Collect-TimelmDiagnostics.ps1 -ValidateOnly
      - name: Validate one-boot GPIO touch helpers without touching hardware
        shell: powershell
        run: ./Resources/Scripts/TouchGpio/Test-TouchGpioGuards.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timelm-native-touch-host-and-client
          path: |
            GPLDrivers/Windows/KonaGeniI2c/out/
            GPLDrivers/Windows/Sw42902Touch/driver/kmdf/out/
          if-no-files-found: warn
  windows-gpio:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: WOA-Kona/Drivers
          ref: 3dcdec0bd59e3e77be92629b2ed9e095ae6e19e8
          path: kona-source
      - shell: pwsh
        run: ./Resources/Scripts/build_kona_drivers.ps1 -Source ./kona-source -Destination ./kona-packages -TimelmTouchFixes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timelm-native-touch-gpio
          path: kona-packages/
          if-no-files-found: warn
  windows-buttons:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rofikkerneldev/timelm_Drivers
          # The full commit is used, a short revision would be read as a
          # branch name by the checkout action.
          ref: 7b35cf5d1a6760e62ff5ad9600845dc110515b9f
          path: buttons-source
      - shell: pwsh
        run: ./Resources/Scripts/Buttons/build_timelm_buttons.ps1 -Source ./buttons-source -Destination ./buttons-packages
      - name: Test the edge logic of the button agent
        shell: pwsh
        run: ./Resources/Scripts/Buttons/Test-TimelmButtonEdges.ps1
      - name: Check the syntax of the button scripts
        shell: pwsh
        run: ./Resources/Scripts/Buttons/Check-TimelmScriptSyntax.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timelm-native-buttons
          path: buttons-packages/
          if-no-files-found: warn
  lifecycle-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test clock rollback, power ordering and failed cleanup
        run: |
          sh -n Resources/Scripts/Collect-TimelmRecoveryTouch.sh
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            GPLDrivers/Windows/KonaGeniI2c/tests/board_test.c \
            GPLDrivers/Windows/KonaGeniI2c/touch_clock.c \
            GPLDrivers/Windows/KonaGeniI2c/touch_board.c -o /tmp/touch-board-test
          /tmp/touch-board-test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            GPLDrivers/Windows/KonaGeniI2c/tests/fifo_test.c \
            GPLDrivers/Windows/KonaGeniI2c/geni_fifo.c -o /tmp/touch-fifo-test
          /tmp/touch-fifo-test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            GPLDrivers/Windows/KonaGeniI2c/tests/gpi_test.c \
            GPLDrivers/Windows/KonaGeniI2c/geni_gpi.c -o /tmp/touch-gpi-test
          /tmp/touch-gpi-test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            -IGPLDrivers/Windows/KonaGeniI2c/tests/iommu_shim \
            GPLDrivers/Windows/KonaGeniI2c/tests/iommu_test.c \
            GPLDrivers/Windows/KonaGeniI2c/iommu_windows.c -o /tmp/touch-iommu-test
          /tmp/touch-iommu-test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            GPLDrivers/Windows/KonaGeniI2c/tests/probe_policy_test.c -o /tmp/touch-probe-policy-test
          /tmp/touch-probe-policy-test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            -IGPLDrivers/Windows/KonaGeniI2c/tests/probe_shim \
            GPLDrivers/Windows/KonaGeniI2c/tests/probe_windows_test.c -o /tmp/touch-probe-windows-test
          /tmp/touch-probe-windows-test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            GPLDrivers/Windows/KonaGeniI2c/tests/bitbang_test.c \
            GPLDrivers/Windows/KonaGeniI2c/bitbang_i2c.c -o /tmp/touch-bitbang-test
          /tmp/touch-bitbang-test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            -IGPLDrivers/Windows/KonaGeniI2c/tests/bitbang_shim \
            GPLDrivers/Windows/KonaGeniI2c/tests/bitbang_windows_test.c -o /tmp/touch-bitbang-windows-test
          /tmp/touch-bitbang-windows-test
          python3 Resources/DeviceOverlays/timelm/Drivers/KonaGPIO/test_touch_bus.py
          python3 Resources/Scripts/tests/test_timelm_touch_iort.py
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            GPLDrivers/Windows/Sw42902Touch/tests/protocol_test.c -o /tmp/touch-protocol-test
          /tmp/touch-protocol-test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            GPLDrivers/Windows/Sw42902Touch/tests/init_test.c -o /tmp/touch-init-test
          /tmp/touch-init-test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            GPLDrivers/Windows/Sw42902Touch/tests/basic_test.c \
            GPLDrivers/Windows/Sw42902Touch/driver/sw42902_basic.c -o /tmp/touch-basic-test
          /tmp/touch-basic-test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            Platforms/LG/timelmPkg/Applications/TouchDmaCheck/snapshot_test.c -o /tmp/touch-dma-check-test
          /tmp/touch-dma-check-test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            Resources/DeviceOverlays/timelm/Drivers/KonaSPMI/tests/transaction_test.c -o /tmp/spmi-transaction-test
          /tmp/spmi-transaction-test
          gcc -std=c11 -Wall -Wextra -Werror \
            GPLDrivers/Windows/Sw42902Touch/tests/decode_capture.c -o /tmp/decode-touch-capture
      - name: Compile disabled native Windows board ACPI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y acpica-tools clang lld
          iasl -ve -p /tmp/TouchWindows Platforms/LG/timelmPkg/Experimental/TouchWindows.asl
          iasl -ve -p /tmp/TouchGpiWindows Platforms/LG/timelmPkg/Experimental/TouchGpiWindows.asl
          python3 Resources/Scripts/build_timelm_touch_iort.py
          iasl -ve -p Build/TouchIommu/TouchIommuWindows Platforms/LG/timelmPkg/Experimental/TouchIommuWindows.asl
          iasl -d Build/TouchIommu/TimelmTouchIort.candidate.aml
      - name: Build read-only DMA prerequisite check with restored Windows chainload
        run: |
          git submodule update --init --depth 1 Mu_Basecore
          bash Resources/Scripts/build_touch_dma_check.sh
          bash Resources/Scripts/build_touch_enumeration.sh
          bash Resources/Scripts/build_touch_gpio_trial.sh
          gcc -std=c11 -fshort-wchar -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            -I Mu_Basecore/MdePkg/Include -I Mu_Basecore/MdePkg/Include/X64 -I Build/TouchEnumeration \
            Platforms/LG/timelmPkg/Applications/TouchEnumeration/trial_test.c -o /tmp/touch-enum-test
          /tmp/touch-enum-test
          gcc -std=c11 -fshort-wchar -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            -I Mu_Basecore/MdePkg/Include -I Mu_Basecore/MdePkg/Include/X64 -I Build/TouchGpio \
            Platforms/LG/timelmPkg/Applications/TouchEnumeration/trial_test.c -o /tmp/touch-gpio-boot-test
          /tmp/touch-gpio-boot-test
      - uses: actions/upload-artifact@v4
        with:
          name: timelm-native-touch-acpi-disabled
          path: |
            /tmp/TouchWindows.aml
            /tmp/TouchGpiWindows.aml
            Build/TouchIommu/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: timelm-touch-dma-check
          path: |
            Build/TouchDmaCheck/TouchDmaCheckOnce.efi
            Build/TouchDmaCheck/touch-dma-check.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: timelm-touch-enumeration-once
          path: |
            Build/TouchEnumeration/TouchEnumerationOnce.efi
            Build/TouchEnumeration/touch-enumeration.json
            Build/TouchEnumeration/touch-enumeration-acpi.json
            Build/TouchEnumeration/TouchEnumeration.aml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: timelm-touch-gpio-once
          path: |
            Build/TouchGpio/TouchGpioOnce.efi
            Build/TouchGpio/touch-gpio.json
            Build/TouchGpio/touch-enumeration-acpi.json
            Build/TouchGpio/TouchGpio.aml
          if-no-files-found: error
